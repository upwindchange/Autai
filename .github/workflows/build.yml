name: Build

# Single build pipeline, using the official electron-builder GitHub Actions
# pattern (no wrapper action — the previously used samuelmeuli/action is
# archived since 2024 and npm/yarn-only).
#
# Triggers:
#   pull_request → build matrix, artifacts uploaded (no publish)
#   tag push     → build matrix + draft GitHub Release via electron-builder
#                  (publishing the draft stays manual — the release gate)
#   manual       → optional Mac App Store / Microsoft Store signed packages
#                  (secrets reference: docs/store-signing.md)

on:
  pull_request:
    branches: [master]
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      build_mas:
        description: "Build Mac App Store packages"
        type: boolean
        default: true
      build_appx:
        description: "Build Microsoft Store package"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    # Regular pipeline; skipped when this run is a manual store dispatch.
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # GITHUB_TOKEN needs this to create a draft release on tag
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24 # LTS; better-sqlite3 v13 requires >= 22

      # Lockfiles are gitignored in this repo; CI resolves from package.json.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build app bundle
        run: pnpm exec electron-vite build

      - name: Package (PR)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: pnpm exec electron-builder --publish never

      # On a tag push, electron-builder creates a DRAFT GitHub Release.
      - name: Package and draft release (tag)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: pnpm exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Also upload to the workflow run (Actions page → Artifacts) on tag
      # builds, in addition to the draft release electron-builder creates.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release_${{ matrix.os }}
          path: release/
          retention-days: 5

  mac-store:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mas }}
    runs-on: macos-latest
    # Store-signing credentials live in the `store-signing` GitHub
    # environment (Settings → Environments), not repo-level secrets.
    environment: store-signing
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Secrets (see docs/store-signing.md):
      #   MAC_APP_P12_BASE64 — "3rd Party Mac Developer Application" .p12, base64
      #   MAC_INSTALLER_P12_BASE64 — "3rd Party Mac Developer Installer" .p12, base64
      #   MAC_APP_P12_PASSWORD / MAC_INSTALLER_P12_PASSWORD — each p12's own password
      #   MAS_PROVISION_BASE64 — embedded.provisionprofile, base64 (optional)
      - name: Import signing certificates into keychain
        env:
          MAC_APP_P12_BASE64: ${{ secrets.MAC_APP_P12_BASE64 }}
          MAC_APP_P12_PASSWORD: ${{ secrets.MAC_APP_P12_PASSWORD }}
          MAC_INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
          MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
        run: |
          # Random keychain password — independent of the p12 passwords and
          # never leaves this ephemeral runner.
          KEYCHAIN_PW="$(openssl rand -hex 24)"
          KEYCHAIN=build.keychain
          echo -n "$MAC_APP_P12_BASE64" | base64 --decode > app.p12
          echo -n "$MAC_INSTALLER_P12_BASE64" | base64 --decode > installer.p12

          # Silent guard: Apple's Security framework cannot import OpenSSL-3
          # p12s (PBES2/AES-256 + SHA-256 MAC) and misreports it as a
          # password failure. Fail fast with the fix if detected; say
          # nothing otherwise. Bash 3.2 on macOS runners — no bash-4 syntax.
          for f in app installer; do
            case "$f" in
              app) pw="$MAC_APP_P12_PASSWORD" ;;
              installer) pw="$MAC_INSTALLER_P12_PASSWORD" ;;
            esac
            if openssl pkcs12 -in "$f.p12" -nokeys -nomacver -passin pass:"$pw" -info 2>&1 | grep -q PBES2; then
              echo "::error::$f.p12 is an OpenSSL-3-format p12 (PBES2). Re-export with -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 and update its BASE64 secret (docs/store-signing.md)."
              exit 1
            fi
          done

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import app.p12 -k "$KEYCHAIN" -P "$MAC_APP_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security import installer.p12 -k "$KEYCHAIN" -P "$MAC_INSTALLER_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm -f app.p12 installer.p12

      # `secrets` is not available in step-level `if` expressions; the
      # guard lives in the shell instead (empty secret → profile-less build).
      - name: Write provisioning profile (if MAS_PROVISION_BASE64 is set)
        env:
          MAS_PROVISION_BASE64: ${{ secrets.MAS_PROVISION_BASE64 }}
        run: |
          if [ -n "$MAS_PROVISION_BASE64" ]; then
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo -n "$MAS_PROVISION_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/embedded.provisionprofile
          else
            echo "MAS_PROVISION_BASE64 not set; building without a profile"
          fi

      - name: Build MAS packages
        env:
          CSC_KEYCHAIN: build.keychain
        run: |
          pnpm exec electron-vite build
          pnpm exec electron-builder --mac mas --publish never
          # The signing log prints provisioningProfile=none when none is
          # configured in electron-builder.json; @electron/osx-sign may
          # still auto-embed one from ~/Library/MobileDevice. Answer it
          # factually: check the built bundle directly.
          for app in release/*/mas-*/Autai.app; do
            if [ -e "$app/Contents/embedded.provisionprofile" ]; then
              echo "$(dirname "$app"): embedded.provisionprofile PRESENT"
            else
              echo "$(dirname "$app"): embedded.provisionprofile ABSENT"
            fi
          done

      - name: Upload MAS artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mas-packages
          path: release/**/Autai_*_mas_*.pkg
          if-no-files-found: error

      # Best-effort; the runner is ephemeral anyway.
      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain || true

  # Store upload path: appx packages for the Microsoft Store are NOT signed
  # by us — Partner Center re-signs them during ingestion, so a CA cert is
  # not required for Store distribution (MSI/EXE installers would be).
  # Additive signing (optional, opt-in via config change in
  # electron-builder.json, see docs/store-signing.md): set the four
  # AZURE_* env vars below and add win.azureSignOptions — the appx gets a
  # real Authenticode signature in addition to the Store's.
  windows-store:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_appx }}
    runs-on: windows-latest
    # Store-signing credentials live in the `store-signing` GitHub
    # environment (Settings → Environments), not repo-level secrets.
    environment: store-signing
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build APPX package
        shell: bash
        env:
          # Only consumed if win.azureSignOptions is enabled in
          # electron-builder.json (read by the TrustedSigning PS module).
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # AZURE_SIGNING_CERTIFICATE_NAME maps to
          # azureSignOptions.certificateProfileName in electron-builder.json.
          AZURE_SIGNING_CERTIFICATE_NAME: ${{ secrets.AZURE_SIGNING_CERTIFICATE_NAME }}
        run: |
          pnpm exec electron-vite build
          pnpm exec electron-builder --win appx --publish never

      # Store ingestion runs the same validation as WACK — failing here is
      # cheaper than a bounced submission. appcert's dynamic tests require an
      # installable package; the appx is deliberately unsigned (Partner Center
      # re-signs it), so sign it locally with a throwaway self-signed cert
      # whose subject matches appx.publisher. Test-only: cert + signature
      # never leave this ephemeral runner; the uploaded artifact stays the
      # unsigned appx.
      - name: Validate with Windows App Certification Kit (WACK)
        shell: pwsh
        # 35 min covers the 30-min appcert watchdog plus cert/signing prep.
        # The earlier silent multi-hour hang was the cert-trust dialog, not
        # appcert (fixed below) — the watchdog is the backstop now.
        timeout-minutes: 35
        run: |
          $ErrorActionPreference = "Stop"
          function Dump-State([string]$tag) {
            # Everything worth knowing when appcert stalls: processes,
            # sessions, installer logs, report/log file states.
            Write-Host "=== [$tag] $((Get-Date).ToString('HH:mm:ss')) ==="
            Get-Process appcert, appcertui, msiexec -ErrorAction SilentlyContinue |
              Select-Object Id, ProcessName, @{n='CPU_s';e={[math]::Round($_.CPU,1)}}, @{n='WS_MB';e={[math]::Round($_.WorkingSet64/1MB)}} |
              Format-Table -AutoSize | Out-String | Write-Host
            quser 2>&1 | Out-String | Write-Host
            Get-ChildItem "$env:ProgramFiles(x86)\Windows Kits\10\App Certification Kit" -Filter "*.log" -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 3 Name, Length, LastWriteTime | Format-Table -AutoSize | Out-String | Write-Host
            foreach ($f in @($report, $outLog, $errLog)) {
              if (Test-Path $f) {
                $i = Get-Item $f
                Write-Host "$($i.Name): $($i.Length) bytes, mtime $($i.LastWriteTime.ToString('HH:mm:ss'))"
              }
            }
          }

          $publisher = "CN=36582D6A-6F9D-4D61-8B74-8CABAC43E1A2"
          $appx = (Get-ChildItem "release/*/Autai_*_x64.appx" | Select-Object -First 1).FullName
          if (-not $appx) { throw "no x64 appx found under release/" }
          Write-Host "Validating: $appx ($((Get-Item $appx).Length) bytes)"

          # Throwaway self-signed cert matching the appx publisher identity.
          # Trust goes into LocalMachine\Root: current-user Root additions
          # raise Windows' "install this certificate?" confirmation dialog,
          # which blocks forever on a headless runner (that was the 2h30
          # "hang" — the cert line, not appcert). Machine-store writes are
          # silent under the runner's admin context. The PFX itself is only
          # a file for signtool — it never needs importing into any store.
          Write-Host "[prep] creating cert…"
          $pw = "wack-" + [guid]::NewGuid().ToString("N")
          $pfx = Join-Path $env:RUNNER_TEMP "wack-signing.pfx"
          $cert = New-SelfSignedCertificate -Subject $publisher `
            -Type CodeSigningCert -KeyUsage DigitalSignature `
            -FriendlyName "WACK test signing" -CertStoreLocation "Cert:\CurrentUser\My"
          Write-Host "[prep] exporting pfx…"
          $certPwd = ConvertTo-SecureString $pw -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $certPwd | Out-Null
          Write-Host "[prep] trusting in LocalMachine\Root…"
          # Root trust needs only the public cert: export a .cer (PFX is not
          # accepted by Import-Certificate) and import that — silent under
          # admin, unlike CurrentUser\Root's confirmation dialog.
          $cer = Join-Path $env:RUNNER_TEMP "wack-signing.cer"
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation "Cert:\LocalMachine\Root" | Out-Null
          Write-Host "[prep] cert trusted: $($cert.Thumbprint)"

          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1).FullName
          Write-Host "[prep] signtool: $signtool"
          & $signtool sign /fd SHA256 /f $pfx /p $pw $appx
          if ($LASTEXITCODE -ne 0) { throw "signtool failed ($LASTEXITCODE)" }
          Write-Host "[prep] package signed"

          $appcert = "C:\Program Files (x86)\Windows Kits\10\App Certification Kit\appcert.exe"
          $report = Join-Path $env:RUNNER_TEMP "WACK-report.xml"
          $outLog = Join-Path $env:RUNNER_TEMP "appcert-out.log"
          $errLog = Join-Path $env:RUNNER_TEMP "appcert-err.log"

          Write-Host "[appcert] reset…"
          & $appcert reset | Out-Null
          Write-Host "[appcert] launching test…"
          $proc = Start-Process -FilePath $appcert `
            -ArgumentList @("test", "-appxpackagepath", "`"$appx`"", "-reportoutputpath", "`"$report`"") `
            -RedirectStandardOutput $outLog -RedirectStandardError $errLog -NoNewWindow -PassThru
          Write-Host "[appcert] pid $($proc.Id)"

          # Watchdog: 5s samples for the first minute (where the previous
          # stall lived), then 60s heartbeats. Healthy WACK runs take 10-30
          # min for an Electron appx; the 30-min ceiling kills true hangs.
          $deadline = (Get-Date).AddMinutes(30)
          while (-not $proc.HasExited -and (Get-Date) -lt $deadline) {
            $elapsed = [int]((Get-Date) - $proc.StartTime).TotalSeconds
            Start-Sleep -Seconds $(if ($elapsed -lt 60) { 5 } else { 60 })
            $cpu = try { [math]::Round($proc.CPU, 1) } catch { -1 }
            $ws = try { [math]::Round($proc.WorkingSet64 / 1MB) } catch { -1 }
            Write-Host ("[watch {0}] alive cpu={1}s ws={2}MB report={3}" -f `
              (Get-Date).ToString('HH:mm:ss'), $cpu, $ws, (Test-Path $report))
          }

          Get-Content $outLog, $errLog -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "[appcert-out] $_" }
          if (-not $proc.HasExited) {
            Dump-State "stalled"
            # appcert's interactive UI is the known Session-0 casualty — if a
            # UI process is sitting there, that is the diagnosis itself.
            Get-Process appcertui -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "::error::appcertui (interactive UI) is running — appcert is waiting on an interactive session the runner cannot provide"
            }
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Get-Process appcertui -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            throw "appcert stalled (no exit after 60s) — diagnostic state dumped above"
          }
          if ($proc.ExitCode -ne 0) { throw "appcert exited with $($proc.ExitCode)" }
          if (-not (Test-Path $report)) { throw "appcert produced no report at $report" }

          # Store semantics: OVERALL_RESULT (attribute of REPORT) is the
          # verdict; tests carry OPTIONAL="TRUE/FALSE". Electron apps
          # routinely trip the optional blocked-executables scan (Chromium
          # runtime refs + dependency strings); the store discounts those,
          # so we warn on optional FAILs and error only on the overall
          # verdict / mandatory-test failures.
          [xml]$xml = Get-Content $report
          $overall = $xml.REPORT.OVERALL_RESULT
          $fails = @($xml.SelectNodes("//TEST") | Where-Object { $_.Result.InnerText -eq "FAIL" })
          # Always keep the report — failure runs need it more than passes.
          Copy-Item $report "WACK-report.xml"
          foreach ($t in $fails) {
            $sev = if ($t.OPTIONAL -eq "TRUE") { "::warning::" } else { "::error::" }
            Write-Host "${sev}[WACK FAIL] $($t.NAME) (optional=$($t.OPTIONAL))"
            @($t.MESSAGES.MESSAGE) | ForEach-Object { Write-Host "    $($_.TEXT)" }
          }
          $mandatoryFails = @($fails | Where-Object { $_.OPTIONAL -ne "TRUE" })
          if ($overall -ine "PASS" -or $mandatoryFails.Count -gt 0) {
            throw "WACK failed (overall: $overall, mandatory failures: $($mandatoryFails.Count)); see WACK-report.xml in artifacts"
          }
          if ($fails.Count -gt 0) {
            Write-Host "WACK passed (overall: $overall; $($fails.Count) optional test failure(s) listed as warnings above)"
          } else {
            Write-Host "WACK passed (overall: $overall)"
          }

      # Runs even when WACK fails — the report is the artifact you need most
      # on a failing run. appx is always present (build step succeeded).
      - name: Upload APPX artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: appx-packages
          path: |
            release/*/Autai_*.appx*
            WACK-report.xml
          if-no-files-found: error
